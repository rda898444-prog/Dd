name: Run Falkon with RealVNC via bore Tunnel

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'رمز عبور برای VNC (حداقل 6 کاراکتر، حداکثر 8 کاراکتر)'
        required: true
        default: 'MyPass12'

jobs:
  run-falkon-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # ۶ ساعت
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. کش کردن bore برای سرعت بیشتر (اختیاری)
      - name: Cache bore
        id: cache-bore
        uses: actions/cache@v4
        with:
          path: ~/bore
          key: ${{ runner.os }}-bore-v0.5.0

      - name: Download bore if not cached
        if: steps.cache-bore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bore
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz -O /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C ~/bore
          chmod +x ~/bore/bore

      # 2. نصب وابستگی‌های سیستمی
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc falkon

      # 3. راه‌اندازی محیط گرافیکی
      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup VNC password
        run: |
          mkdir -p ~/.vnc
          x11vnc -storepasswd "${{ github.event.inputs.vnc_password }}" ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Start x11vnc (listening on 0.0.0.0)
        run: |
          # -listen 0.0.0.0 برای اینکه bore بتواند به آن وصل شود
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -rfbport 5900 -listen 0.0.0.0 -quiet > /dev/null 2>&1 &
          sleep 2

      # 4. اجرای مرورگر سبک Falkon
      - name: Launch Falkon in the virtual display
        run: |
          export DISPLAY=:99
          falkon --no-sandbox --disable-gpu --disable-dev-shm-usage > /dev/null 2>&1 &
          sleep 3

      # 5. تونل TCP با bore و چاپ آدرس اتصال
      - name: Start bore tunnel for VNC (6 hours)
        run: |
          ~/bore/bore local 5900 --to bore.pub > bore.log 2>&1 &
          sleep 5
          
          # استخراج آدرس عمومی از لاگ bore (فرمت: bore.pub:xxxxx)
          ADDR=$(grep -oP 'bore\.pub:\d+' bore.log | head -1)
          
          echo "=================================================="
          echo "🔗 آدرس اتصال برای RealVNC Viewer:"
          echo "   Address: ${ADDR%:*}"
          echo "   Port:    ${ADDR#*:}"
          echo "🔒 رمز عبور: ${{ github.event.inputs.vnc_password }}"
          echo "=================================================="
          echo "👉 در RealVNC Viewer آدرس بالا را وارد کنید و رمز عبور را بزنید."
          echo "=================================================="
          
          sleep 21600
