name: Run Falkon with noVNC and Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'رمز عبور دلخواه برای VNC (حداقل 6 کاراکتر، حداکثر 8 کاراکتر)'
        required: true
        default: 'MyPass12'

jobs:
  run-falkon:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # ۶ ساعت
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. بخش کش کردن cloudflared (دقیقا مثل قبل)
      - name: Cache cloudflared
        id: cache-cloudflared
        uses: actions/cache@v4
        with:
          path: ~/cloudflared
          key: ${{ runner.os }}-cloudflared-latest

      - name: Download cloudflared if not cached
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O ~/cloudflared/cloudflared
          chmod +x ~/cloudflared/cloudflared

      # 2. نصب وابستگی‌ها (به جای chromium-browser از falkon استفاده می‌کنیم)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify falkon

      # 3. راه‌اندازی محیط گرافیکی
      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup VNC password
        run: |
          mkdir -p ~/.vnc
          x11vnc -storepasswd "${{ github.event.inputs.vnc_password }}" ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Start x11vnc with password
        run: |
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -rfbport 5900 -quiet > /dev/null 2>&1 &
          sleep 2

      - name: Start noVNC (websockify)
        run: |
          websockify --web /usr/share/novnc 6080 localhost:5900 > /dev/null 2>&1 &
          sleep 2

      # 4. اجرای مرورگر سبک Falkon به جای کرومیوم
      - name: Launch Falkon in the virtual display
        run: |
          export DISPLAY=:99
          falkon --no-sandbox --disable-gpu --disable-dev-shm-usage > /dev/null 2>&1 &
          sleep 3

      # 5. تونل و چاپ لینک مستقیم
      - name: Start Cloudflare Quick Tunnel (6 hours)
        run: |
          ~/cloudflared/cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log > /dev/null 2>&1 &
          sleep 15
          
          URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' cloudflared.log | head -1)
          
          echo "=================================================="
          echo "🌐 لینک اصلی:      $URL"
          echo "🔒 رمز عبور:        ${{ github.event.inputs.vnc_password }}"
          echo "=================================================="
          echo "👉 لطفاً این لینک را باز کنید (دقت کنید که vnc_lite.html به آخر آن اضافه شده است):"
          echo "$URL/vnc_lite.html"
          echo "=================================================="
          
          sleep 21600
