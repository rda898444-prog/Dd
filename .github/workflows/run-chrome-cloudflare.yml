name: Run Chrome with noVNC and Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'رمز عبور دلخواه برای VNC (حداقل 6 کاراکتر، حداکثر 8 کاراکتر)'
        required: true
        default: 'MyPass12'

jobs:
  run-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # ۶ ساعت
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install all dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify chromium-browser wget
          # دانلود و نصب cloudflared به صورت دستی (چون بسته deb ممکنه وابستگی کم داشته باشه)
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Xvfb virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup VNC password
        run: |
          mkdir -p ~/.vnc
          x11vnc -storepasswd "${{ github.event.inputs.vnc_password }}" ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Start x11vnc with password
        run: |
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -rfbport 5900 -quiet > /dev/null 2>&1 &
          sleep 2

      - name: Start noVNC (websockify)
        run: |
          websockify --web /usr/share/novnc 6080 localhost:5900 > /dev/null 2>&1 &
          sleep 2

      - name: Launch Chromium in the virtual display
        run: |
          export DISPLAY=:99
          chromium-browser --no-sandbox --disable-gpu --disable-dev-shm-usage > /dev/null 2>&1 &
          sleep 2

      - name: Start Cloudflare Quick Tunnel (6 hours)
        run: |
          cloudflared tunnel --url http://localhost:6080 --logfile cloudflared.log > /dev/null 2>&1 &
          sleep 15
          
          # استخراج لینک از لاگ
          URL=$(grep -o 'https://[^ ]*\.trycloudflare\.com' cloudflared.log | head -1)
          
          echo "=================================================="
          echo "🌐 URL:      $URL"
          echo "🔒 Password: ${{ github.event.inputs.vnc_password }}"
          echo "⏱️  مدت اجرا: 6 ساعت"
          echo "=================================================="
          echo "نکته: لینک بالا را در مرورگر باز کنید و رمز عبور را وارد کنید."
          echo "=================================================="
          
          sleep 21600
